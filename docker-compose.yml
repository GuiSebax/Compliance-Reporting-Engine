services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports:
      # Host port 5433 (not 5432) — avoids clashing with a Postgres
      # instance already running on the host. Containers still talk to
      # each other over the internal default, db:5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB holds the schema-flexible, retention-bound forensic trail of
  # rejected ingestion rows (raw payloads). Everything relational and
  # audit-critical stays in Postgres — see README "Technical decisions".
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: compliance
      MONGO_INITDB_ROOT_PASSWORD: compliance
    ports:
      # Host port 27018 (not 27017) for the same reason as Postgres above.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack stands in for AWS (S3, Lambda, EventBridge) so the whole
  # stack runs with zero cloud credentials. See README "AWS / S3 export"
  # and "Scheduled reports (AWS Lambda)" for the real-AWS equivalents.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,lambda,events
      DEFAULT_REGION: us-east-1
      # Lambda runs each function in its own container, started through
      # the host Docker daemon (socket mounted below). Attaching those
      # containers to this compose network lets the function reach
      # `db` and `localstack` by name.
      LAMBDA_DOCKER_NETWORK: compliance-net
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://compliance:compliance@db:5432/compliance
      JWT_SECRET_KEY: local-dev-secret-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      S3_BUCKET_NAME: compliance-reports
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MONGO_URL: mongodb://compliance:compliance@mongo:27017/?authSource=admin
      MONGO_DB_NAME: compliance
      REPORTS_LOCAL_DIR: /app/report_exports
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - report_exports:/app/report_exports

  # --- Scheduled report Lambda (opt-in: `docker compose --profile lambda up`) ---
  #
  # One-shot: builds the Lambda .zip (inside the official Lambda base image,
  # so compiled wheels match the runtime), uploads it to LocalStack S3, and
  # registers the function + EventBridge schedule — using the same script
  # you would point at a real AWS account.
  # Override the schedule to watch it fire, e.g.:
  #   REPORT_SCHEDULE="rate(1 minute)" docker compose --profile lambda up
  lambda-provisioner:
    profiles: ["lambda"]
    build:
      context: ./backend
      dockerfile: Dockerfile.lambda
      target: provisioner
    command:
      - --artifact-bucket=lambda-artifacts
      - --ensure-bucket=lambda-artifacts
      - --ensure-bucket=compliance-reports
      - --role-arn=arn:aws:iam::000000000000:role/compliance-report-lambda
      - --schedule-expression=${REPORT_SCHEDULE:-cron(0 3 1 * ? *)}
      - --env=DATABASE_URL=postgresql+psycopg://compliance:compliance@db:5432/compliance
      - --env=S3_BUCKET_NAME=compliance-reports
      - --env=S3_REGION=us-east-1
      - --env=S3_ENDPOINT_URL=http://localstack:4566
      - --env=LOG_LEVEL=INFO
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
      api:
        # healthy => migrations already applied (entrypoint runs alembic first)
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — the browser (not the
        # frontend container) calls this URL, so it must be reachable from
        # the host, i.e. api's published port, not the internal service name.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  mongo_data:
  localstack_data:
  report_exports:

networks:
  default:
    # Fixed name so LocalStack can attach Lambda containers to it
    # (LAMBDA_DOCKER_NETWORK above).
    name: compliance-net
