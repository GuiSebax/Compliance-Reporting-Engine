[project]
name = "compliance-reporting-engine"
version = "0.1.0"
description = "Auditable batch processing engine for periodic financial compliance reports."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pandas>=2.2,<2.3",
    "PyJWT>=2.9,<3.0",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.12",
    "boto3>=1.35,<2.0",
    "reportlab>=4.2,<5.0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25.0",
    "faker>=30.0,<31.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/db/migrations/*"]
